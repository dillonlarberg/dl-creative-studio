<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cutdown · Music</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/theme.js"></script>
  <link rel="stylesheet" href="assets/alli.css" />
</head>
<body class="font-sans text-gray-800" style="background-color:#EEF1F7">
  <div id="chrome"></div>

  <main class="pt-[60px]">
    <div class="mx-auto max-w-[820px] px-6 pt-8 pb-10 xl:px-10">
      <div class="rounded-2xl bg-white px-6 py-6 shadow-sm ring-1 ring-gray-900/5">
        <div id="pagehead"></div>

      <!-- Info banner: BPM drives the cut grid -->
      <div class="flex items-center gap-2 rounded-lg border border-blue-100 bg-blue-50 px-3.5 py-2.5 text-[13px] font-medium text-blue-800">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="h-4 w-4 shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm12-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
        <span>The track's BPM drives the cut grid — cuts land on the beat, so the reel feels synced. Pick the vibe first.</span>
      </div>

      <!-- Track list -->
      <div class="mt-4 rounded-xl border border-gray-200 p-3">
        <p class="mb-2 px-1 pt-1 text-[10px] font-semibold uppercase tracking-wider text-gray-400">Sample soundtracks</p>
        <div id="tracks" class="flex flex-col gap-2"></div>
      </div>

      <!-- Selected summary line -->
      <p id="summary" class="mt-3 text-[12px] text-gray-500"></p>

      <!-- Footer actions -->
      <div class="mt-6 flex items-center justify-between border-t border-gray-200 pt-4">
        <a href="01-source.html" class="text-[13px] font-medium text-gray-500 hover:text-gray-700">Back</a>
        <a href="03-brief.html" class="inline-flex items-center gap-2 rounded-lg bg-blue-600 px-4 py-2.5 text-[13px] font-semibold text-white transition-colors hover:bg-blue-700 active:bg-blue-800">
          Continue to brief
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/></svg>
        </a>
      </div>
      </div>
    </div>
  </main>

  <script src="assets/mock.js"></script>
  <script src="assets/shell.js"></script>
  <script>
    Shell.mount({
      step: "music",
      title: "Pick a soundtrack",
      subtitle: "Music first — the track's tempo sets the beat grid every cut lands on.",
      back: { href: "01-source.html", label: "Source" },
    });

    const PLAY_GLYPH = '<svg viewBox="0 0 24 24" fill="currentColor" class="h-4 w-4 translate-x-px"><path d="M8 5v14l11-7z"/></svg>';
    const CHECK_BADGE =
      '<div class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-blue-600 shadow">' +
      '<svg viewBox="0 0 20 20" fill="currentColor" class="h-3 w-3 text-white"><path fill-rule="evenodd" d="M16.7 5.3a1 1 0 0 1 0 1.4l-7.5 7.5a1 1 0 0 1-1.4 0l-3.5-3.5a1 1 0 1 1 1.4-1.4l2.8 2.79 6.8-6.79a1 1 0 0 1 1.4 0Z" clip-rule="evenodd"/></svg>' +
      "</div>";

    let selectedId = MOCK.selectedTrackId;
    const container = document.getElementById("tracks");

    function rowHTML(track) {
      const selected = track.trackId === selectedId;
      const base =
        "group relative flex w-full items-center gap-4 rounded-lg border bg-white p-3 text-left shadow-sm transition-all duration-150";
      const stateCls = selected
        ? "border-blue-600 ring-2 ring-blue-600"
        : "border-gray-200 hover:border-blue-300 hover:shadow-md";
      const playCls = selected
        ? "flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-blue-50 text-blue-600"
        : "flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-gray-100 text-gray-600 group-hover:bg-blue-50 group-hover:text-blue-600";
      return (
        `<button type="button" data-id="${track.trackId}" class="${base} ${stateCls}">` +
        `<span class="${playCls}">${PLAY_GLYPH}</span>` +
        `<span class="min-w-0 flex-1">` +
        `<span class="block truncate text-[13px] font-medium text-gray-900">${track.title}</span>` +
        `<span class="mt-0.5 block text-[11px] text-gray-500">${track.mood} · ${track.genre}</span>` +
        `</span>` +
        `<span class="flex shrink-0 items-center gap-3">` +
        `<span class="rounded-md bg-gray-100 px-2 py-0.5 font-mono text-[11px] text-gray-600">${track.bpm} BPM</span>` +
        `<span class="font-mono text-[11px] text-gray-400">${MOCK.fmtTime(track.durationSec)}</span>` +
        (selected ? CHECK_BADGE : "") +
        `</span>` +
        `</button>`
      );
    }

    function summaryHTML() {
      const t = MOCK.track(selectedId);
      return `Selected: <span class="font-semibold text-gray-700">${t.title}</span> · ${t.bpm} BPM · ${t.mood}`;
    }

    function render() {
      container.innerHTML = MOCK.tracks.map(rowHTML).join("");
      document.getElementById("summary").innerHTML = summaryHTML();
    }

    container.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-id]");
      if (!btn) return;
      selectedId = btn.getAttribute("data-id");
      render();
    });

    render();
  </script>
</body>
</html>
