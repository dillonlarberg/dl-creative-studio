<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cutdown · Render</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/theme.js"></script>
</head>
<body class="font-sans text-gray-800" style="background-color:#EEF1F7">
  <div id="chrome"></div>

  <main class="pt-[60px]">
    <div class="mx-auto max-w-[820px] px-8 pt-8 pb-16">
      <div id="pagehead"></div>

      <!-- Success banner -->
      <div class="mb-6 flex items-center gap-2 rounded-lg border border-green-200 bg-green-50 px-3.5 py-2.5 text-[13px] font-medium text-green-800">
        <svg viewBox="0 0 20 20" fill="currentColor" class="h-4 w-4 shrink-0"><path fill-rule="evenodd" d="M16.7 5.3a1 1 0 0 1 0 1.4l-7.5 7.5a1 1 0 0 1-1.4 0l-3.5-3.5a1 1 0 1 1 1.4-1.4l2.8 2.79 6.8-6.79a1 1 0 0 1 1.4 0Z" clip-rule="evenodd"/></svg>
        Rendered in 42s — Highlights cut · 0:30 · 9:16
      </div>

      <!-- Two-column layout -->
      <div class="flex flex-col md:flex-row gap-6">
        <!-- LEFT — vertical player -->
        <div class="shrink-0">
          <div id="player" class="relative aspect-[9/16] w-[260px] mx-auto md:mx-0 overflow-hidden rounded-xl border border-gray-200 shadow-md">
            <!-- watermark chip -->
            <div class="absolute top-2 right-2 rounded bg-black/40 px-2 py-0.5 text-[9px] font-medium text-white/80">SHOTSTACK SANDBOX</div>
            <!-- big play button -->
            <div class="absolute inset-0 flex items-center justify-center">
              <div class="flex h-14 w-14 items-center justify-center rounded-full bg-white/90 shadow-lg">
                <svg viewBox="0 0 24 24" fill="currentColor" class="h-6 w-6 translate-x-px text-gray-900"><path d="M8 5v14l11-7z"/></svg>
              </div>
            </div>
            <!-- timecode badge -->
            <span class="absolute bottom-2 right-2 rounded bg-black/65 px-1.5 py-0.5 font-mono text-[10px] text-white">0:30</span>
          </div>
          <!-- scrubber -->
          <div class="mx-auto md:mx-0 mt-3 w-[260px]">
            <div class="relative h-1 w-full rounded-full bg-gray-200">
              <div class="absolute inset-y-0 left-0 w-[1%] rounded-full bg-blue-600"></div>
              <div class="absolute top-1/2 left-[1%] h-2.5 w-2.5 -translate-x-1/2 -translate-y-1/2 rounded-full bg-blue-600 shadow"></div>
            </div>
            <div class="mt-2 flex w-full items-center justify-between">
              <span class="w-px h-2 bg-gray-300"></span>
              <span class="w-px h-2 bg-gray-300"></span>
              <span class="w-px h-2 bg-gray-300"></span>
              <span class="w-px h-2 bg-gray-300"></span>
              <span class="w-px h-2 bg-gray-300"></span>
              <span class="w-px h-2 bg-gray-300"></span>
            </div>
          </div>
        </div>

        <!-- RIGHT — details card -->
        <div class="flex-1 rounded-lg border border-gray-200 bg-white p-5 shadow-sm">
          <p class="mb-3 text-[10px] font-semibold uppercase tracking-wider text-gray-400">Output</p>
          <dl id="specs" class="space-y-2 text-[12px]"></dl>

          <div class="my-4 border-t border-gray-200"></div>

          <div class="flex flex-wrap items-center gap-3">
            <button type="button" class="inline-flex items-center gap-2 rounded-lg bg-blue-600 px-4 py-2.5 text-[13px] font-semibold text-white transition-colors hover:bg-blue-700 active:bg-blue-800">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
              Download MP4
            </button>
            <button type="button" class="rounded-lg border border-gray-300 px-4 py-2 text-[13px] font-medium text-gray-700 hover:bg-gray-50">Share link</button>
          </div>

          <p class="mt-3 text-[12px] text-gray-500">Sandbox render carries a watermark. Production renders are clean.</p>
        </div>
      </div>

      <!-- Footer actions -->
      <div class="mt-6 flex items-center justify-between border-t border-gray-200 pt-4">
        <div class="flex items-center gap-4">
          <a href="05-versions.html" class="inline-flex items-center gap-2 rounded-lg border border-gray-300 px-4 py-2 text-[13px] font-medium text-gray-700 hover:bg-gray-50">
            <span aria-hidden="true">⟳</span> Re-roll versions
          </a>
          <a href="index.html" class="text-[13px] font-medium text-gray-500 hover:text-gray-700">Start a new cutdown</a>
        </div>
        <span class="text-[12px] text-gray-400">Saved to your cutdowns</span>
      </div>
    </div>
  </main>

  <script src="assets/mock.js"></script>
  <script src="assets/shell.js"></script>
  <script>
    Shell.mount({
      step: "render",
      title: "Your reel is ready",
      subtitle: "Rendered to 9:16 · 1080×1920 with the track baked in.",
      back: { href: "05-versions.html", label: "Versions" },
    });

    // Player hero gradient.
    document.getElementById("player").style.backgroundImage = MOCK.frameGradient("render-hero");

    // Selected plan = the highlights angle; selected track.
    const plan = MOCK.plans.find((p) => p.angle === "highlights");
    const track = MOCK.track(MOCK.selectedTrackId);

    const rows = [
      ["Length", "0:30"],
      ["Aspect", "9:16 (1080×1920)"],
      ["Cuts", `${plan.cuts.length} hard cuts`],
      ["Track", `${track.title} · ${track.bpm} BPM (baked, tail fade)`],
      ["Angle", MOCK.ANGLE_META[plan.angle].label],
    ];

    document.getElementById("specs").innerHTML = rows
      .map(
        ([k, v]) =>
          `<div class="flex items-start justify-between gap-4">
             <dt class="shrink-0 text-gray-500">${k}</dt>
             <dd class="text-right font-medium text-gray-900">${v}</dd>
           </div>`,
      )
      .join("");
  </script>
</body>
</html>
