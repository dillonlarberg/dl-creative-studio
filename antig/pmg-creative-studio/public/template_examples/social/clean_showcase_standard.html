<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>clean_showcase_standard</title>
  <style>
    @font-face {
      font-family: "DynamicFont";
      src: url("https://firebasestorage.googleapis.com/v0/b/automated-creative-e10d7.firebasestorage.app/o/clients%2Fstrategy%2Fassets%2Ffont%2FPPRightGrotesk-WideBold.otf?alt=media&token=dea7ebfb-8609-49e7-bec9-20290a869128") format("opentype");
      font-weight: normal; font-style: normal; font-display: swap;
    }
    html, body { width: 100%; height: 100%; margin: 0; }
    #ad {
      position: relative; width: 1024px; height: 1024px;
      overflow: hidden; background: #ffffff;
      font-family: "DynamicFont", Arial, sans-serif;
    }
    #headline1 {
      position: absolute; left: 62px; top: 90px;
      width: 900px; text-align: center;
      color: #1a1a1a; font-size: 52px; line-height: 1.1;
    }
    #image_1 {
      position: absolute; left: 152px; top: 230px;
      width: 720px; height: 720px; object-fit: cover;
    }
    #footnote {
      position: absolute; left: 0; bottom: 36px;
      width: 1024px; text-align: center;
      color: #999999; font-size: 22px; letter-spacing: 3px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="ad">
    <p id="headline1">The Essentials Collection</p>
    <img id="image_1" alt="" src="https://picsum.photos/seed/cleanshowcase/720/720">
    <div id="footnote">Available now in store and online</div>
  </div>
</body>
</html>
