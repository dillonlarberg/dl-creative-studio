<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>organic_shapes_editorial</title>
  <style>
    @font-face {
      font-family: "DynamicFont";
      src: url("https://firebasestorage.googleapis.com/v0/b/automated-creative-e10d7.firebasestorage.app/o/clients%2Fstrategy%2Fassets%2Ffont%2FPPRightGrotesk-WideBold.otf?alt=media&token=dea7ebfb-8609-49e7-bec9-20290a869128") format("opentype");
      font-weight: normal; font-style: normal; font-display: swap;
    }
    html, body { width: 100%; height: 100%; margin: 0; }
    #ad {
      position: relative; width: 511px; height: 511px;
      overflow: hidden; background: #f5f0e8;
      font-family: "DynamicFont", Arial, sans-serif;
    }
    #background_image {
      position: absolute; inset: 0;
      width: 511px; height: 511px; object-fit: cover; opacity: .35;
    }
    #blob1 {
      position: absolute; left: -80px; top: -90px;
      width: 320px; height: 320px; background: #88a078;
      border-radius: 60% 40% 55% 45% / 55% 50% 50% 45%;
    }
    #blob2 {
      position: absolute; right: -70px; bottom: -80px;
      width: 280px; height: 280px; background: #c85250;
      border-radius: 45% 55% 50% 50% / 50% 45% 55% 50%;
    }
    #image1 {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 280px; height: 280px; border-radius: 50%;
      object-fit: cover; border: 8px solid #f5f0e8;
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
    }
    #tag {
      position: absolute; left: 50%; bottom: 30px;
      transform: translateX(-50%);
      color: #c85250; font-size: 18px; letter-spacing: 3px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="ad">
    <img id="background_image" alt="" src="https://picsum.photos/seed/organicbg/511/511">
    <div id="blob1"></div>
    <div id="blob2"></div>
    <img id="image1" alt="" src="https://picsum.photos/seed/organicportrait/280/280">
    <div id="tag">Handmade Goods</div>
  </div>
</body>
</html>
