<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>minimalist_retail_edge</title>
  <style>
    @font-face {
      font-family: "DynamicFont";
      src: url("https://firebasestorage.googleapis.com/v0/b/automated-creative-e10d7.firebasestorage.app/o/clients%2Fstrategy%2Fassets%2Ffont%2FPPRightGrotesk-WideBold.otf?alt=media&token=dea7ebfb-8609-49e7-bec9-20290a869128") format("opentype");
      font-weight: normal; font-style: normal; font-display: swap;
    }
    html, body { width: 100%; height: 100%; margin: 0; }
    #ad {
      position: relative; width: 1077px; height: 1077px;
      overflow: hidden; background: #111111;
      font-family: "DynamicFont", Arial, sans-serif;
    }
    #background-image {
      position: absolute; inset: 0;
      width: 1077px; height: 1077px; object-fit: cover;
    }
    #headline2 {
      position: absolute; left: 70px; top: 720px;
      background: rgba(255,255,255,.92); color: #111111;
      padding: 18px 34px; font-size: 44px; letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="ad">
    <img id="background-image" alt="" src="https://picsum.photos/seed/minretailedge/1077/1077">
    <div id="headline2">Quietly Bold</div>
  </div>
</body>
</html>
