<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>editorial_brand_spotlight</title>
  <style>
    @font-face {
      font-family: "DynamicFont";
      src: url("https://firebasestorage.googleapis.com/v0/b/automated-creative-e10d7.firebasestorage.app/o/clients%2Fstrategy%2Fassets%2Ffont%2FPPRightGrotesk-WideBold.otf?alt=media&token=dea7ebfb-8609-49e7-bec9-20290a869128") format("opentype");
      font-weight: normal; font-style: normal; font-display: swap;
    }
    html, body { width: 100%; height: 100%; margin: 0; }
    #ad {
      position: relative; width: 1024px; height: 1024px;
      overflow: hidden; background: #0f0f0f;
      font-family: "DynamicFont", Arial, sans-serif;
    }
    #background_image {
      position: absolute; inset: 0;
      width: 1024px; height: 1024px; object-fit: cover;
    }
    #gradient {
      position: absolute; left: 0; bottom: 0;
      width: 1024px; height: 410px;
      background: linear-gradient(180deg, rgba(15,15,15,0) 0%, rgba(15,15,15,.92) 100%);
    }
    #fbg-logo {
      position: absolute; right: 60px; top: 56px;
      color: #ffffff; font-size: 28px; letter-spacing: 5px;
      text-transform: uppercase;
    }
    #cta {
      position: absolute; left: 64px; bottom: 250px;
      background: #e63946; color: #ffffff;
      padding: 14px 32px; font-size: 26px; letter-spacing: 2px;
      text-transform: uppercase;
    }
    #headline {
      position: absolute; left: 64px; bottom: 70px;
      width: 850px; color: #ffffff;
      font-size: 84px; line-height: .98; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="ad">
    <img id="background_image" alt="" src="https://picsum.photos/seed/editorialspot/1024/1024">
    <div id="gradient"></div>
    <div id="fbg-logo">Studio</div>
    <div id="cta">Shop Now</div>
    <p id="headline">Define Your Edge</p>
  </div>
</body>
</html>
