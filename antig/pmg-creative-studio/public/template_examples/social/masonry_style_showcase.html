<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>masonry_style_showcase</title>
  <style>
    @font-face {
      font-family: "DynamicFont";
      src: url("https://firebasestorage.googleapis.com/v0/b/automated-creative-e10d7.firebasestorage.app/o/clients%2Fstrategy%2Fassets%2Ffont%2FPPRightGrotesk-WideBold.otf?alt=media&token=dea7ebfb-8609-49e7-bec9-20290a869128") format("opentype");
      font-weight: normal; font-style: normal; font-display: swap;
    }
    html, body { width: 100%; height: 100%; margin: 0; }
    #ad {
      position: relative; width: 1024px; height: 1024px;
      overflow: hidden; background: #2d3748;
      font-family: "DynamicFont", Arial, sans-serif;
    }
    .tile { position: absolute; object-fit: cover; }
    #t1 { left: 40px; top: 40px; width: 440px; height: 580px; }
    #t2 { left: 500px; top: 40px; width: 484px; height: 270px; }
    #t3 { left: 500px; top: 330px; width: 234px; height: 290px; }
    #t4 { left: 754px; top: 330px; width: 230px; height: 290px; }
    #t5 { left: 40px; top: 640px; width: 280px; height: 344px; }
    #t6 { left: 340px; top: 640px; width: 644px; height: 344px; }
    #logo {
      position: absolute; left: 50%; top: 470px;
      transform: translateX(-50%);
      background: #fffbf5; color: #2d3748;
      padding: 10px 28px; font-size: 26px; letter-spacing: 4px;
      text-transform: uppercase; z-index: 3;
    }
    #headline {
      position: absolute; left: 0; top: 350px;
      width: 1024px; text-align: center; color: #fffbf5;
      font-size: 70px; line-height: .95; text-transform: uppercase;
      text-shadow: 0 4px 18px rgba(0,0,0,.5); z-index: 2;
    }
    #headline span { color: #c17c4a; }
  </style>
</head>
<body>
  <div id="ad">
    <img class="tile" id="t1" alt="" src="https://picsum.photos/seed/mason1/440/580">
    <img class="tile" id="t2" alt="" src="https://picsum.photos/seed/mason2/484/270">
    <img class="tile" id="t3" alt="" src="https://picsum.photos/seed/mason3/234/290">
    <img class="tile" id="t4" alt="" src="https://picsum.photos/seed/mason4/230/290">
    <img class="tile" id="t5" alt="" src="https://picsum.photos/seed/mason5/280/344">
    <img class="tile" id="t6" alt="" src="https://picsum.photos/seed/mason6/644/344">
    <p id="headline">The <span>Lookbook</span></p>
    <div id="logo">Gallery</div>
  </div>
</body>
</html>
