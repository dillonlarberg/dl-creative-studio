<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>new_arrivals_reveal</title>
  <style>
    @font-face {
      font-family: "DynamicFont";
      src: url("https://firebasestorage.googleapis.com/v0/b/automated-creative-e10d7.firebasestorage.app/o/clients%2Fstrategy%2Fassets%2Ffont%2FPPRightGrotesk-WideBold.otf?alt=media&token=dea7ebfb-8609-49e7-bec9-20290a869128") format("opentype");
      font-weight: normal; font-style: normal; font-display: swap;
    }
    html, body { width: 100%; height: 100%; margin: 0; }
    #ad {
      position: relative; width: 822px; height: 822px;
      overflow: hidden; background: #000000;
      font-family: "DynamicFont", Arial, sans-serif;
    }
    #background-image {
      position: absolute; inset: 0;
      width: 822px; height: 822px; object-fit: cover;
    }
    #grad-top {
      position: absolute; left: 0; top: 0;
      width: 822px; height: 250px;
      background: linear-gradient(180deg, rgba(0,0,0,.7) 0%, rgba(0,0,0,0) 100%);
    }
    #grad-bottom {
      position: absolute; left: 0; bottom: 0;
      width: 822px; height: 165px;
      background: linear-gradient(0deg, rgba(0,0,0,.8) 0%, rgba(0,0,0,0) 100%);
    }
    #title {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 760px; text-align: center; color: #ffffff;
      font-size: 130px; line-height: .88; text-transform: uppercase;
    }
    #title span { color: #0047FF; }
    #logo {
      position: absolute; left: 50%; bottom: 44px;
      transform: translateX(-50%);
      background: #ffffff; color: #000000;
      padding: 10px 28px; border-radius: 999px;
      font-size: 22px; letter-spacing: 3px; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="ad">
    <img id="background-image" alt="" src="https://picsum.photos/seed/newarrivals/822/822">
    <div id="grad-top"></div>
    <div id="grad-bottom"></div>
    <div id="title">New<br><span>Arrivals</span></div>
    <div id="logo">Brand</div>
  </div>
</body>
</html>
