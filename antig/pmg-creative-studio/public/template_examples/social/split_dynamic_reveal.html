<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>split_dynamic_reveal</title>
  <style>
    @font-face {
      font-family: "DynamicFont";
      src: url("https://firebasestorage.googleapis.com/v0/b/automated-creative-e10d7.firebasestorage.app/o/clients%2Fstrategy%2Fassets%2Ffont%2FPPRightGrotesk-WideBold.otf?alt=media&token=dea7ebfb-8609-49e7-bec9-20290a869128") format("opentype");
      font-weight: normal; font-style: normal; font-display: swap;
    }
    html, body { width: 100%; height: 100%; margin: 0; }
    #ad {
      position: relative; width: 1024px; height: 1024px;
      overflow: hidden; background: #1e3a8a;
      font-family: "DynamicFont", Arial, sans-serif;
    }
    #panel {
      position: absolute; left: 0; top: 0;
      width: 360px; height: 1024px; background: #1e3a8a; z-index: 2;
    }
    #background_image {
      position: absolute; left: 360px; top: 0;
      width: 664px; height: 1024px; object-fit: cover;
    }
    #background_asset {
      position: absolute; left: 360px; top: 0;
      width: 664px; height: 1024px;
      background: linear-gradient(180deg, rgba(30,58,138,0) 50%, rgba(30,58,138,.6) 100%);
    }
    #logo_1 {
      position: absolute; left: 48px; top: 70px;
      color: #f8fafc; font-size: 28px; letter-spacing: 4px;
      text-transform: uppercase; z-index: 3;
    }
    #headline_1 {
      position: absolute; left: 48px; top: 380px;
      width: 270px; color: #f8fafc;
      font-size: 64px; line-height: .95; text-transform: uppercase; z-index: 3;
    }
    #headline_1 span { color: #f59e0b; }
    #headline_2 {
      position: absolute; left: 0; bottom: 50px;
      width: 1024px; text-align: center; color: #ffffff;
      font-size: 30px; letter-spacing: 4px; text-transform: uppercase; z-index: 3;
    }
  </style>
</head>
<body>
  <div id="ad">
    <img id="background_image" alt="" src="https://picsum.photos/seed/splitreveal/664/1024">
    <div id="background_asset"></div>
    <div id="panel"></div>
    <div id="logo_1">Motion</div>
    <p id="headline_1">Made to <span>Move</span></p>
    <div id="headline_2">The Performance Line — Out Now</div>
  </div>
</body>
</html>
