<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>interior_design_grid</title>
  <style>
    @font-face {
      font-family: "DynamicFont";
      src: url("https://firebasestorage.googleapis.com/v0/b/automated-creative-e10d7.firebasestorage.app/o/clients%2Fstrategy%2Fassets%2Ffont%2FPPRightGrotesk-WideBold.otf?alt=media&token=dea7ebfb-8609-49e7-bec9-20290a869128") format("opentype");
      font-weight: normal; font-style: normal; font-display: swap;
    }
    html, body { width: 100%; height: 100%; margin: 0; }
    #ad {
      position: relative; width: 433px; height: 433px;
      overflow: hidden; background: #f8f4ef;
      font-family: "DynamicFont", Arial, sans-serif;
    }
    #image1 {
      position: absolute; left: 0; top: 0;
      width: 433px; height: 260px; object-fit: cover;
    }
    #logo {
      position: absolute; right: 14px; top: 12px;
      color: #f8f4ef; font-size: 13px; letter-spacing: 2px;
      text-transform: uppercase;
    }
    #accent {
      position: absolute; left: 28px; top: 286px;
      width: 44px; height: 4px; background: #c17c4a;
    }
    #headline {
      position: absolute; left: 28px; top: 308px;
      width: 377px; color: #4a5568;
      font-size: 30px; line-height: 1.05;
    }
    #sub {
      position: absolute; left: 28px; bottom: 26px;
      color: #c17c4a; font-size: 13px; letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="ad">
    <img id="image1" alt="" src="https://picsum.photos/seed/interiorgrid/433/260">
    <div id="logo">Casa</div>
    <div id="accent"></div>
    <p id="headline">Warm Minimal Living</p>
    <div id="sub">The Home Collection</div>
  </div>
</body>
</html>
