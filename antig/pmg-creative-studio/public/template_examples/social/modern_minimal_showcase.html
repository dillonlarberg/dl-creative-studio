<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>modern_minimal_showcase</title>
  <style>
    @font-face {
      font-family: "DynamicFont";
      src: url("https://firebasestorage.googleapis.com/v0/b/automated-creative-e10d7.firebasestorage.app/o/clients%2Fstrategy%2Fassets%2Ffont%2FPPRightGrotesk-WideBold.otf?alt=media&token=dea7ebfb-8609-49e7-bec9-20290a869128") format("opentype");
      font-weight: normal; font-style: normal; font-display: swap;
    }
    html, body { width: 100%; height: 100%; margin: 0; }
    #ad {
      position: relative; width: 1080px; height: 1080px;
      overflow: hidden; background: #f4f6f4;
      font-family: "DynamicFont", Arial, sans-serif;
    }
    #block {
      position: absolute; left: 0; top: 0;
      width: 1080px; height: 540px; background: #1b4332;
    }
    #logo {
      position: absolute; left: 50%; top: 270px;
      transform: translate(-50%, -50%);
      color: #ffffff; font-size: 58px; letter-spacing: 10px;
      text-transform: uppercase;
    }
    #sub {
      position: absolute; left: 50%; top: 640px;
      transform: translateX(-50%);
      color: #1b4332; font-size: 30px; letter-spacing: 4px;
      text-transform: uppercase; text-align: center;
    }
    #label {
      position: absolute; right: 60px; bottom: 60px;
      background: #52b788; color: #ffffff;
      padding: 12px 26px; border-radius: 999px;
      font-size: 24px; letter-spacing: 2px; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="ad">
    <div id="block"></div>
    <div id="logo">Verde</div>
    <div id="sub">Considered by Design</div>
    <div id="label">New In</div>
  </div>
</body>
</html>
