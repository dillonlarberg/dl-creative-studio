<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>interactive_vibe_social</title>
  <style>
    @font-face {
      font-family: "DynamicFont";
      src: url("https://firebasestorage.googleapis.com/v0/b/automated-creative-e10d7.firebasestorage.app/o/clients%2Fstrategy%2Fassets%2Ffont%2FPPRightGrotesk-WideBold.otf?alt=media&token=dea7ebfb-8609-49e7-bec9-20290a869128") format("opentype");
      font-weight: normal; font-style: normal; font-display: swap;
    }
    html, body { width: 100%; height: 100%; margin: 0; }
    #ad {
      position: relative; width: 1024px; height: 1024px;
      overflow: hidden; background: #111111;
      font-family: "DynamicFont", Arial, sans-serif;
    }
    #blob {
      position: absolute; left: -120px; top: 280px;
      width: 760px; height: 760px; border-radius: 50%;
      background: #ffd600;
    }
    #image1 {
      position: absolute; left: 70px; top: 180px;
      width: 540px; height: 660px; object-fit: cover;
      transform: rotate(-5deg);
      box-shadow: 0 20px 50px rgba(0,0,0,.4);
    }
    #image2 {
      position: absolute; left: 540px; top: 470px;
      width: 410px; height: 480px; object-fit: cover;
      transform: rotate(6deg);
      border: 10px solid #ff2d78;
      box-shadow: 0 20px 50px rgba(0,0,0,.4);
    }
    #logo {
      position: absolute; right: 56px; top: 50px;
      color: #ff2d78; font-size: 26px; letter-spacing: 4px;
      text-transform: uppercase;
    }
    #kicker {
      position: absolute; left: 70px; top: 70px;
      color: #ffffff; font-size: 60px; line-height: .95;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="ad">
    <div id="blob"></div>
    <div id="kicker">Let's<br>Go</div>
    <img id="image1" alt="" src="https://picsum.photos/seed/vibesocial1/540/660">
    <img id="image2" alt="" src="https://picsum.photos/seed/vibesocial2/410/480">
    <div id="logo">Pulse</div>
  </div>
</body>
</html>
