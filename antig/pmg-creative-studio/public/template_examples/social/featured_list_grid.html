<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>featured_list_grid</title>
  <style>
    @font-face {
      font-family: "DynamicFont";
      src: url("https://firebasestorage.googleapis.com/v0/b/automated-creative-e10d7.firebasestorage.app/o/clients%2Fstrategy%2Fassets%2Ffont%2FPPRightGrotesk-WideBold.otf?alt=media&token=dea7ebfb-8609-49e7-bec9-20290a869128") format("opentype");
      font-weight: normal; font-style: normal; font-display: swap;
    }
    html, body { width: 100%; height: 100%; margin: 0; }
    #ad {
      position: relative; width: 1024px; height: 1024px;
      overflow: hidden; background: #faf8f5;
      font-family: "DynamicFont", Arial, sans-serif;
    }
    #image1 {
      position: absolute; left: 0; top: 0;
      width: 512px; height: 512px; object-fit: cover;
    }
    #image2 {
      position: absolute; left: 0; top: 512px;
      width: 512px; height: 512px; object-fit: cover;
    }
    #panel {
      position: absolute; left: 512px; top: 0;
      width: 512px; height: 1024px; background: #1c1c1e;
    }
    #logo {
      position: absolute; left: 512px; top: 80px;
      width: 512px; text-align: center;
      color: #faf8f5; font-size: 30px; letter-spacing: 6px;
      text-transform: uppercase;
    }
    #promo {
      position: absolute; left: 552px; top: 380px;
      width: 432px; text-align: center; color: #ffffff;
      font-size: 92px; line-height: .95; text-transform: uppercase;
    }
    #promo span { color: #f7c900; }
  </style>
</head>
<body>
  <div id="ad">
    <img id="image1" alt="" src="https://picsum.photos/seed/featgrid1/512/512">
    <img id="image2" alt="" src="https://picsum.photos/seed/featgrid2/512/512">
    <div id="panel"></div>
    <div id="logo">Collective</div>
    <div id="promo">Up to <span>50%</span> Off</div>
  </div>
</body>
</html>
