<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bold_typography_quick</title>
  <style>
    @font-face {
      font-family: "DynamicFont";
      src: url("https://firebasestorage.googleapis.com/v0/b/automated-creative-e10d7.firebasestorage.app/o/clients%2Fstrategy%2Fassets%2Ffont%2FPPRightGrotesk-WideBold.otf?alt=media&token=dea7ebfb-8609-49e7-bec9-20290a869128") format("opentype");
      font-weight: normal; font-style: normal; font-display: swap;
    }
    html, body { width: 100%; height: 100%; margin: 0; }
    #ad {
      position: relative; width: 603px; height: 603px;
      overflow: hidden; background: #ffffff;
      font-family: "DynamicFont", Arial, sans-serif;
    }
    #image1 {
      position: absolute; left: 0; top: 0;
      width: 603px; height: 523px; object-fit: cover;
    }
    #logo {
      position: absolute; left: 24px; top: 22px;
      width: 96px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      background: #ff3300; color: #fff;
      font-size: 18px; letter-spacing: 1px; text-transform: uppercase;
    }
    #bar {
      position: absolute; left: 0; bottom: 0;
      width: 603px; height: 80px;
      background: #111111; color: #ffffff;
      display: flex; align-items: center; padding: 0 26px;
      box-sizing: border-box;
      font-size: 40px; letter-spacing: 2px; text-transform: uppercase;
    }
    #bar span { color: #ff3300; margin-left: 12px; }
  </style>
</head>
<body>
  <div id="ad">
    <img id="image1" alt="" src="https://picsum.photos/seed/boldtypo/603/523">
    <div id="logo">Brand</div>
    <div id="bar">New Drop<span>'24</span></div>
  </div>
</body>
</html>
