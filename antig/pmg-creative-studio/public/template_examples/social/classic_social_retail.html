<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>classic_social_retail</title>
  <style>
    @font-face {
      font-family: "DynamicFont";
      src: url("https://firebasestorage.googleapis.com/v0/b/automated-creative-e10d7.firebasestorage.app/o/clients%2Fstrategy%2Fassets%2Ffont%2FPPRightGrotesk-WideBold.otf?alt=media&token=dea7ebfb-8609-49e7-bec9-20290a869128") format("opentype");
      font-weight: normal; font-style: normal; font-display: swap;
    }
    html, body { width: 100%; height: 100%; margin: 0; }
    #ad {
      position: relative; width: 1024px; height: 1024px;
      overflow: hidden; background: #1a2744;
      font-family: "DynamicFont", Arial, sans-serif;
    }
    #image_background {
      position: absolute; inset: 0;
      width: 1024px; height: 1024px; object-fit: cover;
    }
    #background_test {
      position: absolute; inset: 0;
      width: 1024px; height: 1024px;
      background: linear-gradient(180deg, rgba(26,39,68,.55) 0%, rgba(26,39,68,.25) 45%, rgba(26,39,68,.7) 100%);
    }
    #logo {
      position: absolute; left: 50%; top: 70px;
      transform: translateX(-50%);
      width: 340px; height: 56px;
      display: flex; align-items: center; justify-content: center;
      color: #ffffff; border: 2px solid #c8a96a;
      font-size: 30px; letter-spacing: 8px; text-transform: uppercase;
    }
    #tagline {
      position: absolute; left: 50%; bottom: 90px;
      transform: translateX(-50%);
      color: #c8a96a; font-size: 26px; letter-spacing: 4px;
      text-transform: uppercase; text-align: center;
    }
  </style>
</head>
<body>
  <div id="ad">
    <img id="image_background" alt="" src="https://picsum.photos/seed/retailclassic/1024/1024">
    <div id="background_test"></div>
    <div id="logo">Maison</div>
    <div id="tagline">The Spring Edit</div>
  </div>
</body>
</html>
