<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dual_lifestyle_focus</title>
  <style>
    @font-face {
      font-family: "DynamicFont";
      src: url("https://firebasestorage.googleapis.com/v0/b/automated-creative-e10d7.firebasestorage.app/o/clients%2Fstrategy%2Fassets%2Ffont%2FPPRightGrotesk-WideBold.otf?alt=media&token=dea7ebfb-8609-49e7-bec9-20290a869128") format("opentype");
      font-weight: normal; font-style: normal; font-display: swap;
    }
    html, body { width: 100%; height: 100%; margin: 0; }
    #ad {
      position: relative; width: 1024px; height: 1024px;
      overflow: hidden; background: #f5efe6;
      font-family: "DynamicFont", Arial, sans-serif;
    }
    #background-image {
      position: absolute; inset: 0;
      width: 1024px; height: 1024px; object-fit: cover; opacity: .25;
    }
    #image1 {
      position: absolute; left: 60px; top: 212px;
      width: 432px; height: 600px; object-fit: cover;
    }
    #image2 {
      position: absolute; left: 532px; top: 212px;
      width: 432px; height: 600px; object-fit: cover;
    }
    #logo {
      position: absolute; left: 50%; top: 70px;
      transform: translateX(-50%);
      color: #2d2d2d; font-size: 34px; letter-spacing: 6px;
      text-transform: uppercase;
    }
    #callout-container {
      position: absolute; right: 56px; bottom: 70px;
      width: 168px; height: 168px; border-radius: 50%;
      background: #00897b;
      display: flex; align-items: center; justify-content: center;
      transform: rotate(-8deg);
    }
    #callout {
      color: #ffffff; font-size: 30px; text-align: center;
      line-height: 1.05; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="ad">
    <img id="background-image" alt="" src="https://picsum.photos/seed/duallifebg/1024/1024">
    <img id="image1" alt="" src="https://picsum.photos/seed/duallife1/432/600">
    <img id="image2" alt="" src="https://picsum.photos/seed/duallife2/432/600">
    <div id="logo">Atelier</div>
    <div id="callout-container"><div id="callout">New<br>Season</div></div>
  </div>
</body>
</html>
