<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>geometric_design_system</title>
  <style>
    @font-face {
      font-family: "DynamicFont";
      src: url("https://firebasestorage.googleapis.com/v0/b/automated-creative-e10d7.firebasestorage.app/o/clients%2Fstrategy%2Fassets%2Ffont%2FPPRightGrotesk-WideBold.otf?alt=media&token=dea7ebfb-8609-49e7-bec9-20290a869128") format("opentype");
      font-weight: normal; font-style: normal; font-display: swap;
    }
    html, body { width: 100%; height: 100%; margin: 0; }
    #ad {
      position: relative; width: 1080px; height: 1080px;
      overflow: hidden; background: #ffffff;
      font-family: "DynamicFont", Arial, sans-serif;
    }
    #shape-a {
      position: absolute; left: 0; top: 0;
      width: 1080px; height: 1080px;
      background: #2b4eff;
      clip-path: polygon(0 0, 100% 0, 100% 55%, 0 100%);
    }
    #shape-b {
      position: absolute; right: 0; bottom: 0;
      width: 520px; height: 520px;
      background: #ff4d2b;
      clip-path: polygon(100% 100%, 100% 0, 0 100%);
    }
    #logo {
      position: absolute; left: 70px; top: 64px;
      color: #ffffff; font-size: 30px; letter-spacing: 6px;
      text-transform: uppercase;
    }
    #headline {
      position: absolute; left: 60px; top: 360px;
      width: 960px; color: #ffffff;
      font-size: 150px; line-height: .92; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="ad">
    <div id="shape-a"></div>
    <div id="shape-b"></div>
    <div id="logo">Form</div>
    <p id="headline">Built to Move</p>
  </div>
</body>
</html>
