<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>promo_banner_vibrant</title>
  <style>
    @font-face {
      font-family: "DynamicFont";
      src: url("https://firebasestorage.googleapis.com/v0/b/automated-creative-e10d7.firebasestorage.app/o/clients%2Fstrategy%2Fassets%2Ffont%2FPPRightGrotesk-WideBold.otf?alt=media&token=dea7ebfb-8609-49e7-bec9-20290a869128") format("opentype");
      font-weight: normal; font-style: normal; font-display: swap;
    }
    html, body { width: 100%; height: 100%; margin: 0; }
    #ad {
      position: relative; width: 1024px; height: 1024px;
      overflow: hidden; background: #ff0080;
      font-family: "DynamicFont", Arial, sans-serif;
    }
    .shape { position: absolute; }
    #c1 { left: -120px; top: -120px; width: 460px; height: 460px; border-radius: 50%; background: #ffee00; }
    #c2 { right: -140px; bottom: -140px; width: 520px; height: 520px; border-radius: 50%; background: #00ff88; }
    #tri { left: 720px; top: 60px; width: 0; height: 0;
      border-left: 110px solid transparent; border-right: 110px solid transparent;
      border-bottom: 190px solid #00ff88; transform: rotate(20deg); }
    #sq { left: 80px; bottom: 120px; width: 150px; height: 150px;
      background: #ffee00; transform: rotate(15deg); }
    #d1 { left: 250px; top: 130px; width: 40px; height: 40px; border-radius: 50%; background: #00ff88; }
    #d2 { right: 200px; top: 230px; width: 28px; height: 28px; border-radius: 50%; background: #ffee00; }
    #d3 { left: 180px; bottom: 360px; width: 34px; height: 34px; border-radius: 50%; background: #ffffff; }
    #sale {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%) rotate(-6deg);
      color: #ffffff; font-size: 280px; line-height: .8;
      text-transform: uppercase; text-align: center;
      text-shadow: 8px 8px 0 #111;
    }
    #sub {
      position: absolute; left: 50%; top: 50%; margin-top: 150px;
      transform: translate(-50%, 0) rotate(-6deg);
      background: #111; color: #ffee00;
      padding: 14px 40px; font-size: 48px; letter-spacing: 4px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="ad">
    <div class="shape" id="c1"></div>
    <div class="shape" id="c2"></div>
    <div class="shape" id="tri"></div>
    <div class="shape" id="sq"></div>
    <div class="shape" id="d1"></div>
    <div class="shape" id="d2"></div>
    <div class="shape" id="d3"></div>
    <div id="sale">Sale</div>
    <div id="sub">Up to 70% Off</div>
  </div>
</body>
</html>
