name: preflight

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: antig/pmg-creative-studio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: antig/pmg-creative-studio/package-lock.json

      - name: Configure npm auth for @agencypmg
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add the @agencypmg-scoped npm token to repo Secrets as NPM_TOKEN."
            exit 1
          fi
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run preflight
        run: npm run preflight
